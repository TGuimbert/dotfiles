name: "CI"
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: "experimental-features = flakes nix-command pipe-operators"
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: tguimbert
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Check formatting
        run: nix fmt -- --ci

      - name: Check flake (evaluate outputs without building them)
        run: |
          systems=$(nix eval --raw .#nixosConfigurations --apply \
            'cfgs: builtins.concatStringsSep " " (builtins.map (n: ".#nixosConfigurations." + n + ".config.system.build.toplevel") (builtins.attrNames cfgs))')
          shells=$(nix eval --raw .#devShells.x86_64-linux --apply \
            'sh: builtins.concatStringsSep " " (builtins.map (n: ".#devShells.x86_64-linux." + n) (builtins.attrNames sh))')
          read -r -a system_targets <<< "$systems"
          read -r -a shell_targets <<< "$shells"
          nix build --dry-run "${system_targets[@]}" "${shell_targets[@]}"

      - name: Evaluate portable Home Manager modules on all supported systems
        run: |
          nix eval --json .#checks --apply '
            builtins.mapAttrs (_: checks:
              builtins.mapAttrs (_: drv: drv.drvPath)
                (builtins.removeAttrs checks
                  (builtins.filter (name: builtins.substring 0 5 name != "home:")
                    (builtins.attrNames checks))))'

  build-home:
    name: Build macOS terminal modules
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: "experimental-features = flakes nix-command pipe-operators"
      - name: Build the suite with stable and terminal-overlay packages
        run: |
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          nix build --no-link ".#checks.$system.home:terminalSuite" ".#checks.$system.home:terminalOverlay"

  build-systems:
    name: Build Systems
    runs-on: ubuntu-latest
    needs: check
    # Only run on Renovate PRs or push to main
    if: >
      github.event_name == 'push' ||
      startsWith(github.head_ref, 'renovate/')
    strategy:
      fail-fast: false
      matrix:
        system:
          - leshen
          - griffin
          - srv-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/microsoft /opt/google
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /opt/ghc
          sudo docker image prune --all --force
          docker system prune -af || true
          docker builder prune -af || true
          df -h
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: "experimental-features = flakes nix-command pipe-operators"
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: tguimbert
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build ${{ matrix.system }}
        run: nix build .#nixosConfigurations.${{ matrix.system }}.config.system.build.toplevel

  build-shells:
    name: Build Shells
    runs-on: ubuntu-latest
    needs: check
    # Only run on Renovate PRs or push to main
    if: >
      github.event_name == 'push' ||
      startsWith(github.head_ref, 'renovate/')
    strategy:
      fail-fast: false
      matrix:
        shell:
          - go
          - markdown
          - nixos
          - nodejs
          - ops
          - protobuf
          - python
          - rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: "experimental-features = flakes nix-command pipe-operators"
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: tguimbert
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build ${{ matrix.shell }} shell
        run: nix build .#devShells.x86_64-linux.${{ matrix.shell }}

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [check, build-home, build-systems, build-shells]
    if: always()
    steps:
      - name: Check job results
        run: |
          # check job must always pass
          if [[ "${{ needs.check.result }}" != "success" ]]; then
            echo "Check job failed"
            exit 1
          fi
          if [[ "${{ needs.build-home.result }}" != "success" ]]; then
            echo "macOS home build failed"
            exit 1
          fi
          # build jobs only need to pass if they ran (Renovate PRs)
          if [[ "${{ needs.build-systems.result }}" == "failure" ]] || \
             [[ "${{ needs.build-shells.result }}" == "failure" ]]; then
            echo "Build jobs failed"
            exit 1
          fi
          echo "All required checks passed!"
